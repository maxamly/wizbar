name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Use newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build universal app
        run: ./build.sh --universal

      - name: Zip
        run: |
          ditto -c -k --keepParent build.noindex/WizBar.app WizBar.zip
          shasum -a 256 WizBar.zip | cut -d' ' -f1 > WizBar.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: WizBar
          path: |
            WizBar.zip
            WizBar.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" WizBar.zip WizBar.zip.sha256 --title "WizBar $GITHUB_REF_NAME" --generate-notes
